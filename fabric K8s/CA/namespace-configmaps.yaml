---
# ─────────────────────────────────────────────
#  Namespace
# ─────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: fabric
  labels:
    app: hyperledger-fabric

---
# ─────────────────────────────────────────────
#  ConfigMap — fabric-ca-server-config Org1
#  (monta el YAML que ya teníamos)
# ─────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-org1-config
  namespace: fabric
data:
  fabric-ca-server-config.yaml: |
    version: 1.5.7
    port: 7054
    debug: false
    crlsizelimit: 512000
    tls:
      enabled: true
      certfile:
      keyfile:
      clientauth:
        type: noclientcert
        certfiles:
    ca:
      name: ca-org1
    registry:
      maxenrollments: -1
      identities:
        - name: admin
          pass: "OVERRIDE_VIA_SECRET"
          type: client
          affiliation: ""
          attrs:
            hf.Registrar.Roles: "*"
            hf.Registrar.DelegateRoles: "*"
            hf.Revoker: true
            hf.IntermediateCA: true
            hf.GenCRL: true
            hf.Registrar.Attributes: "*"
            hf.AffiliationMgr: true
    db:
      type: sqlite3
      datasource: fabric-ca-server.db
      tls:
        enabled: false
    affiliations:
      org1:
        - department1
        - department2
    signing:
      default:
        usage:
          - digital signature
        expiry: 8760h
      profiles:
        ca:
          usage:
            - cert sign
            - crl sign
          expiry: 43800h
          caconstraint:
            isca: true
            maxpathlen: 0
        tls:
          usage:
            - signing
            - key encipherment
            - server auth
            - client auth
            - key agreement
          expiry: 8760h
    csr:
      cn: ca-org1
      keyrequest:
        algo: ecdsa
        size: 256
      names:
        - C: US
          ST: "North Carolina"
          O: org1.example.com
      hosts:
        - ca-org1
        - ca-org1.fabric.svc.cluster.local
        - localhost
        - 127.0.0.1
      ca:
        expiry: 131400h
        pathlength: 1
    bccsp:
      default: SW
      sw:
        hash: SHA2
        security: 256
        filekeystore:
          keystore: msp/keystore
    operations:
      listenAddress: 0.0.0.0:17054
      tls:
        enabled: false

---
