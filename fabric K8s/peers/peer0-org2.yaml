---
# ═══════════════════════════════════════════════════════════
#  Peer0 — Org2
#
#  Estructura esperada dentro del PVC crypto-store:
#  /crypto-store/
#  └── peerOrganizations/
#      └── org2.example.com/
#          ├── msp/
#          └── peers/
#              └── peer0.org2.example.com/
#                  ├── msp/
#                  └── tls/
# ═══════════════════════════════════════════════════════════

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: peer0-org2-pvc
  namespace: fabric
  labels:
    app: peer0-org2
    org: org2
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard        # ← ajusta según tu cluster
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peer0-org2
  namespace: fabric
  labels:
    app: peer0-org2
    org: org2
    component: peer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peer0-org2
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: peer0-org2
        org: org2
        component: peer
    spec:
      volumes:
        - name: peer-data
          persistentVolumeClaim:
            claimName: peer0-org2-pvc
        - name: crypto-store
          persistentVolumeClaim:
            claimName: crypto-store   # ← mismo PVC compartido de certs
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock

      containers:
        - name: peer
          image: hyperledger/fabric-peer:2.5.4
          imagePullPolicy: IfNotPresent
          env:
            # ── Identidad del peer ────────────────────────────────────────
            - name: CORE_PEER_ID
              value: peer0.org2.example.com
            - name: CORE_PEER_LOCALMSPID
              value: Org2MSP
            - name: CORE_PEER_MSPCONFIGPATH
              value: /etc/hyperledger/fabric/msp

            # ── Red ───────────────────────────────────────────────────────
            - name: CORE_PEER_ADDRESS
              value: peer0-org2.fabric.svc.cluster.local:9051
            - name: CORE_PEER_LISTENADDRESS
              value: 0.0.0.0:9051
            - name: CORE_PEER_CHAINCODEADDRESS
              value: peer0-org2.fabric.svc.cluster.local:9052
            - name: CORE_PEER_CHAINCODELISTENADDRESS
              value: 0.0.0.0:9052

            # ── Gossip ───────────────────────────────────────────────────
            - name: CORE_PEER_GOSSIP_BOOTSTRAP
              value: peer0-org2.fabric.svc.cluster.local:9051
            - name: CORE_PEER_GOSSIP_EXTERNALENDPOINT
              value: peer0-org2.fabric.svc.cluster.local:9051
            - name: CORE_PEER_GOSSIP_USELEADERELECTION
              value: "true"
            - name: CORE_PEER_GOSSIP_ORGLEADER
              value: "false"

            # ── TLS ──────────────────────────────────────────────────────
            - name: CORE_PEER_TLS_ENABLED
              value: "true"
            - name: CORE_PEER_TLS_CERT_FILE
              value: /etc/hyperledger/fabric/tls/server.crt
            - name: CORE_PEER_TLS_KEY_FILE
              value: /etc/hyperledger/fabric/tls/server.key
            - name: CORE_PEER_TLS_ROOTCERT_FILE
              value: /etc/hyperledger/fabric/tls/ca.crt

            # ── CouchDB ──────────────────────────────────────────────────
            - name: CORE_LEDGER_STATE_STATEDATABASE
              value: CouchDB
            - name: CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS
              value: couchdb-org2.fabric.svc.cluster.local:5984
            - name: CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fabric-couchdb-credentials
                  key: YOUR_SECURE_PASSWORD
            - name: CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fabric-couchdb-credentials
                  key: YOUR_SECURE_PASSWORD

            # ── Logs ─────────────────────────────────────────────────────
            - name: FABRIC_LOGGING_SPEC
              value: INFO
            - name: CORE_PEER_FILESYSTEMPATH
              value: /var/hyperledger/production

            # ── Docker (para chaincode builder clásico) ──────────────────
            - name: CORE_VM_ENDPOINT
              value: unix:///var/run/docker.sock
            - name: CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE
              value: fabric

          ports:
            - name: peer
              containerPort: 9051
              protocol: TCP
            - name: chaincode
              containerPort: 9052
              protocol: TCP
            - name: operations
              containerPort: 9443
              protocol: TCP

          volumeMounts:
            - name: peer-data
              mountPath: /var/hyperledger/production
            - name: crypto-store
              mountPath: /etc/hyperledger/fabric/msp
              subPath: peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp
            - name: crypto-store
              mountPath: /etc/hyperledger/fabric/tls
              subPath: peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls
            - name: docker-sock
              mountPath: /var/run/docker.sock

          livenessProbe:
            httpGet:
              path: /healthz
              port: 9443
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9443
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: peer0-org2
  namespace: fabric
  labels:
    app: peer0-org2
    org: org2
spec:
  selector:
    app: peer0-org2
  ports:
    - name: peer
      port: 9051
      targetPort: 9051
      protocol: TCP
    - name: chaincode
      port: 9052
      targetPort: 9052
      protocol: TCP
    - name: operations
      port: 9443
      targetPort: 9443
      protocol: TCP
  type: ClusterIP
