---
# ═══════════════════════════════════════════════════════════
#  CouchDB — Org1
# ═══════════════════════════════════════════════════════════

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-org1-pvc
  namespace: fabric
  labels:
    app: couchdb-org1
    org: org1
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard        # ← ajusta según tu cluster
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb-org1
  namespace: fabric
  labels:
    app: couchdb-org1
    org: org1
    component: couchdb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: couchdb-org1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: couchdb-org1
        org: org1
        component: couchdb
    spec:
      containers:
        - name: couchdb
          image: couchdb:3.3.2
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: fabric-couchdb-credentials
                  key: USE_YOUR_SECURE_PASSWORD
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fabric-couchdb-credentials
                  key: USE_YOUR_SECURE_PASSWORD
          ports:
            - name: couchdb
              containerPort: 5984
              protocol: TCP
          volumeMounts:
            - name: couchdb-data
              mountPath: /opt/couchdb/data
          livenessProbe:
            httpGet:
              path: /
              port: 5984
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5984
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: couchdb-data
          persistentVolumeClaim:
            claimName: couchdb-org1-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: couchdb-org1
  namespace: fabric
  labels:
    app: couchdb-org1
    org: org1
spec:
  selector:
    app: couchdb-org1
  ports:
    - name: couchdb
      port: 5984
      targetPort: 5984
      protocol: TCP
  type: ClusterIP
